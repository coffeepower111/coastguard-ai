<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해양치안 AI</title><style>body{font-family:system-ui,sans-serif;background:#f3f6fa;margin:0;color:#172033}.w{max-width:760px;margin:auto;padding:16px}.c{background:#fff;padding:16px;margin:12px 0;border-radius:14px;box-shadow:0 2px 9px #0001}textarea{width:100%;box-sizing:border-box;min-height:150px;padding:12px;border:1px solid #ccd5e0;border-radius:10px;font-size:16px}button{padding:12px 16px;border:0;border-radius:10px;margin:7px 5px 0 0;font-weight:bold}.p{background:#0969da;color:white}.v{white-space:pre-wrap;line-height:1.55}.label{font-weight:bold;color:#536174;margin-bottom:6px}li{line-height:1.7}.small{font-size:12px;color:#687586}</style></head><body><div class="w"><h2>🌊 해양치안 AI 신고·순찰 지원</h2><div class="c"><div class="label">신고내용</div><textarea id="q" placeholder="예: 동호항 인근 갯벌에 소유자 표시가 없는 선박이 방치되어 있다는 신고"></textarea><button class="p" onclick="go()">AI 분석하기</button><span id="load"></span></div><div id="out"></div><div class="c small">※ AI는 현장 판단을 보조합니다. 실제 출동·법집행 등 최종 판단은 담당자가 합니다.</div></div><script>const labels={type:"신고유형",risk:"위험도",place:"추정 장소",visit:"현장 출동",patrol:"순찰 제안",report:"상관 보고용 요약"};function block(k,v){return `<div class="c"><div class="label">${labels[k]||k}</div><div class="v">${v||""}</div></div>`}function list(k,a){return `<div class="c"><div class="label">${labels[k]||k}</div><ul>${(a||[]).map(x=>`<li>${x}</li>`).join("")}</ul></div>`}async function go(){let q=document.getElementById("q").value.trim();if(!q)return alert("신고내용을 입력해 주세요.");document.getElementById("load").textContent=" 분석 중...";try{let r=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({report:q})}),d=await r.json();if(!r.ok)throw Error(d.error);let h="";["type","risk","place","visit"].forEach(k=>h+=block(k,d[k]));h+=list("check",d.check)+list("questions",d.questions)+list("action",d.action)+block("patrol",d.patrol)+block("report",d.report);document.getElementById("out").innerHTML=h}catch(e){alert(e.message)}finally{document.getElementById("load").textContent=""}}</script></body></html>
